name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a new upstream release that breaks us (e.g. Pillow 13's
    # multi-line getbbox) shows up here instead of in a user's bug report.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Oldest supported (pyproject requires-python) and the pinned dev version
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync environment (locked deps)
        run: uv sync --all-extras --python ${{ matrix.python }}
      - name: Run tests
        # --no-sync: a bare `uv run` re-syncs with default options, silently
        # pruning the extras (and the --python override) installed above.
        run: uv run --no-sync pytest -q

  # uv.lock pins what CI tests, but a fresh `pip install` of the package gets
  # whatever is newest (or, in an old environment, whatever satisfies the
  # floors in pyproject). These two jobs test both ends of that range.
  dependency-range:
    name: deps (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: highest       # newest releases, ignoring uv.lock
            python: "3.12"
          - resolution: lowest-direct # the minimums pyproject declares
            python: "3.11"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Sync environment (${{ matrix.resolution }} versions)
        run: uv sync --all-extras --python ${{ matrix.python }} --upgrade --resolution ${{ matrix.resolution }}
      - name: Show resolved versions
        run: uv pip list
      - name: Run tests
        run: uv run --no-sync pytest -q

  # Known vulnerabilities in what uv.lock installs (CI, Docker, `uv sync`).
  # Runs on the weekly schedule too, so a CVE published after a merge shows
  # up here; the fix is usually a `uv lock --upgrade-package NAME`.
  audit:
    name: vulnerability scan (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Export the locked dependency set
        run: uv export --frozen --all-extras --all-groups --no-hashes --no-emit-project -o audit-requirements.txt
      - name: pip-audit
        run: uvx pip-audit==2.10.1 --no-deps --disable-pip --progress-spinner off -r audit-requirements.txt
