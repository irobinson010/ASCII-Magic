name: Release

# Publishing a GitHub Release (web UI or `gh release create vX.Y.Z`) runs
# this: tests, a tag/version check, then the sdist and wheel are built and
# attached to that release. Empty release notes are filled from the
# version's CHANGELOG.md section. See "Releasing" in the README.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras
      - run: uv run --no-sync pytest -q

  assets:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload files to the release and set its notes
    env:
      # Through env, never ${{ }} inside a script: a crafted tag name can't inject commands.
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@v7
      - name: Tag must match the package version
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::release tag is $TAG but pyproject.toml says $version"; exit 1
          fi
          if ! grep -qx "__version__ = \"$version\"" src/asciimagic/__init__.py; then
            echo "::error::__version__ in src/asciimagic/__init__.py is not $version"; exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Release notes from CHANGELOG.md (only if the release has none)
        run: |
          if [ -n "$(gh release view "$TAG" --json body --jq .body)" ]; then
            echo "Release already has notes; leaving them."; exit 0
          fi
          version="${TAG#v}"
          awk -v v="## $version" '$0 == v || index($0, v " ") == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section"; exit 1
          fi
          gh release edit "$TAG" --notes-file notes.md
      - name: Attach the files
        run: gh release upload "$TAG" dist/* --clobber
