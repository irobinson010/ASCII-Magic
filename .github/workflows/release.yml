name: Release

# Push a tag like v0.3.0 to publish that version as a GitHub Release,
# with the sdist and wheel attached. See "Releasing" in the README.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run --no-sync pytest -q

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its files
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
      - name: Tag must match the package version
        # The tag name reaches the shell through an env var, never ${{ }}
        # interpolation, so a crafted tag name can't inject commands.
        run: |
          version="$(uv version --short)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag is $GITHUB_REF_NAME but pyproject.toml says $version"; exit 1
          fi
          if ! grep -qx "__version__ = \"$version\"" src/asciimagic/__init__.py; then
            echo "::error::__version__ in src/asciimagic/__init__.py is not $version"; exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v || index($0, v " ") == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section"; exit 1
          fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
