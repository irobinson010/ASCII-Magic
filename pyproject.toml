[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-magic-tools"
version = "0.3.0"
description = "Convert images and text to colorized ASCII art - CLI tools, an in-memory pipeline, and a web GUI"
requires-python = ">=3.11"
# Floors are the oldest releases with no known vulnerabilities: a resolver
# can land on them, and these libraries parse untrusted images and uploads.
dependencies = [
    "Pillow>=13",
    "numpy>=2",
    "pyfiglet>=1.0.4",
]
authors = [
    { name = "Ian Robinson", email = "irobinson010@gmail.com" },
]
readme = "README.MD"
license = {text = "Apache-2.0"}
keywords = ["ascii", "ascii-art", "ansi", "terminal", "braille", "matrix", "figlet", "video"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Fonts",
]

[project.urls]
Homepage = "https://github.com/irobinson010/ASCII-Magic"
Repository = "https://github.com/irobinson010/ASCII-Magic"
Issues = "https://github.com/irobinson010/ASCII-Magic/issues"
Changelog = "https://github.com/irobinson010/ASCII-Magic/blob/main/CHANGELOG.md"

[project.optional-dependencies]
web = [
    "fastapi>=0.133",  # the first that accepts starlette 1.3.1
    "starlette>=1.3.1",  # multipart parsing of uploads; older releases have DoS CVEs
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.31",
]
video = [
    "imageio>=2.34",
    "imageio-ffmpeg>=0.6",  # bundles ffmpeg 7; 0.5 bundles ffmpeg 4.2 (2019), which decodes uploads
]
translate = [
    "ctranslate2>=4.0",
    "sentencepiece>=0.2.1",
]
subject = [
    "onnxruntime>=1.19",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27",
    "httpx2>=2.16",  # newer starlette.testclient prefers it over httpx
]

[project.scripts]
ascii-magic = "asciimagic.unified_cli:main"
image-to-ascii = "asciimagic.image_to_ascii:main"
colorize-ascii = "asciimagic.colorize_ascii:main"
text-to-ascii = "asciimagic.text_to_ascii:main"
ascii-magic-web = "asciimagic.webapp:main"
ascii-magic-greet = "asciimagic.greet:main"
ascii-magic-video = "asciimagic.video:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asciimagic = ["static/*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["bin", "lib", "lib64", ".git", ".venv", "venv", "env"]
